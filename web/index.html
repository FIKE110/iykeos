    background: rgba(0, 255, 136, 0.1);

  .cache-status.cached {

    border-color: #00ccff;
    background: rgba(0, 204, 255, 0.1);
  }

  .progress-container {
    width: 400px;
    height: 20px;
    background: #0a0a0a;
    border: 2px solid #00ff88;
    border-radius: 10px;
    overflow: hidden;
    position: relative;

  .progress-bar {
    height: 100%;
    background: linear-gradient(90deg, #00ff88 0%, #00cc6a 100%);
    width: 0%;
    transition: width 0.3s ease;
    box-shadow: 0 0 10px #00ff88;
  }

  .progress-bar.cached {
    background: linear-gradient(90deg, #00ccff 0%, #0099cc 100%);
    box-shadow: 0 0 10px #00ccff;
  }

  .progress-text {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: 12px;
    color: white;
    font-weight: bold;
    text-shadow: 1px 1px 2px black;
  }

  .loading-file {
    margin-top: 15px;
    font-size: 11px;
    color: #666;
  }

  .loading-stats {
    margin-top: 10px;
    font-size: 11px;
    color: #555;
  }

  .cache-actions {

  .cache-actions button {

  .file-cache-item {

<script>
"use strict";

// IndexedDB Cache Manager
const CacheManager = {
    DB_NAME: 'IYKEOS_Cache',
    DB_VERSION: 1,
    STORE_NAME: 'assets',
    
    db: null,
    
    init: function() {
        return new Promise((resolve, reject) => {
            const request = indexedDB.open(this.DB_NAME, this.DB_VERSION);
            
            request.onerror = () => reject(request.error);
            request.onsuccess = () => {
                this.db = request.result;
                resolve();
            };
            
            request.onupgradeneeded = (event) => {
                const db = event.target.result;
                if (!db.objectStoreNames.contains(this.STORE_NAME)) {
                    db.createObjectStore(this.STORE_NAME, { keyPath: 'url' });
                }
            };
        });
    },
    
    get: function(url) {
        return new Promise((resolve, reject) => {
            if (!this.db) {
                resolve(null);
                return;
            }
            
            const transaction = this.db.transaction([this.STORE_NAME], 'readonly');
            const store = transaction.objectStore(this.STORE_NAME);
            const request = store.get(url);
            
            request.onsuccess = () => resolve(request.result);
            request.onerror = () => reject(request.error);
        });
    },
    
    set: function(url, data, metadata = {}) {
        return new Promise((resolve, reject) => {
            if (!this.db) {
                resolve();
                return;
            }
            
            const transaction = this.db.transaction([this.STORE_NAME], 'readwrite');
            const store = transaction.objectStore(this.STORE_NAME);
            
            const entry = {
                url: url,
                data: data,
                timestamp: Date.now(),
                size: data.byteLength || data.length,
                ...metadata
            };
            
            const request = store.put(entry);
            request.onsuccess = () => resolve();
            request.onerror = () => reject(request.error);
        });
    },
    
    delete: function(url) {
        return new Promise((resolve, reject) => {
            if (!this.db) {
                resolve();
                return;
            }
            
            const transaction = this.db.transaction([this.STORE_NAME], 'readwrite');
            const store = transaction.objectStore(this.STORE_NAME);
            const request = store.delete(url);
            
            request.onsuccess = () => resolve();
            request.onerror = () => reject(request.error);
        });
    },
    
    clear: function() {
        return new Promise((resolve, reject) => {
            if (!this.db) {
                resolve();
                return;
            }
            
            const transaction = this.db.transaction([this.STORE_NAME], 'readwrite');
            const store = transaction.objectStore(this.STORE_NAME);
            const request = store.clear();
            
            request.onsuccess = () => resolve();
            request.onerror = () => reject(request.error);
        });
    },
    
    getAllCached: function() {
        return new Promise((resolve, reject) => {
            if (!this.db) {
                resolve([]);
                return;
            }
            
            const transaction = this.db.transaction([this.STORE_NAME], 'readonly');
            const store = transaction.objectStore(this.STORE_NAME);
            const request = store.getAllKeys();
            
            request.onsuccess = () => resolve(request.result);
            request.onerror = () => reject(request.error);
        });
    }
};

// Asset URLs
const ASSETS = {
    wasm: "./assets/v86.wasm",
    bios: "./bios/seabios.bin",
    vga: "./bios/vgabios.bin",
    hdd: "./assets/harddisk.img"
};

window.onload = async function()
{
    const loadingOverlay = document.getElementById("loading_overlay");
    const progressBar = document.getElementById("progress_bar");
    const progressText = document.getElementById("progress_text");
    const loadingFile = document.getElementById("loading_file");
    const loadingStats = document.getElementById("loading_stats");
    const cacheStatus = document.getElementById("cache_status");
    const cacheActions = document.getElementById("cache_actions");
    const fileCacheList = document.getElementById("file_cache_list");
    const bootLog = document.getElementById("boot_log");
    
    // Status elements
    const statusWasm = document.getElementById("status_wasm");
    const statusBios = document.getElementById("status_bios");
    const statusVga = document.getElementById("status_vga");
    const statusHdd = document.getElementById("status_hdd");
    
    // Initialize cache
    try {
        await CacheManager.init();
        addBootMessage("[CACHE] IndexedDB initialized");
    } catch (e) {
        addBootMessage("[CACHE] IndexedDB not available, using network only");
        cacheStatus.textContent = "Cache not available - using network";
        cacheStatus.style.color = "#ffaa00";
        cacheStatus.style.borderColor = "#ffaa00";
    }
    
    let forceRefresh = false;
    
    function addBootMessage(msg) {
        const line = document.createElement("div");
        line.className = "boot-line";
        line.textContent = msg;
        bootLog.appendChild(line);
        bootLog.scrollTop = bootLog.scrollHeight;
    }
    
    function updateProgress(percent, filename, loaded, total) {
        progressBar.style.width = percent + "%";
        progressText.textContent = Math.round(percent) + "%";
        if (filename) {
            loadingFile.textContent = filename;
        }
        if (loaded && total) {
            const loadedMB = (loaded / 1024 / 1024).toFixed(1);
            const totalMB = (total / 1024 / 1024).toFixed(1);
            loadingStats.textContent = `${loadedMB} MB / ${totalMB} MB`;
        }
    }
    
    function setFileStatus(element, status, isCached) {
        element.textContent = status;
        if (isCached) {
            element.classList.add("cached");
        }
    }
    
    function enableControls() {
        document.getElementById("run").disabled = false;
        document.getElementById("save_state").disabled = false;
        document.getElementById("load_state").disabled = false;
        document.getElementById("toggle_mouse").disabled = false;
        document.getElementById("lock_mouse").disabled = false;
        document.getElementById("fullscreen").disabled = false;
        document.getElementById("take_screenshot").disabled = false;
        document.getElementById("toggle_theatre").disabled = false;
    }
    
    // Check cached assets
    fileCacheList.style.display = "block";
    const cachedAssets = {};
    let totalCachedSize = 0;
    let cachedCount = 0;
    
    for (const [key, url] of Object.entries(ASSETS)) {
        try {
            const cached = await CacheManager.get(url);
            cachedAssets[key] = cached;
            
            if (cached) {
                totalCachedSize += cached.size;
                cachedCount++;
                const sizeKB = (cached.size / 1024).toFixed(0);
                
                if (key === "wasm") setFileStatus(statusWasm, `✓ cached (${sizeKB} KB)`, true);
                if (key === "bios") setFileStatus(statusBios, `✓ cached (${sizeKB} KB)`, true);
                if (key === "vga") setFileStatus(statusVga, `✓ cached (${sizeKB} KB)`, true);
                if (key === "hdd") setFileStatus(statusHdd, `✓ cached (${(cached.size / 1024 / 1024).toFixed(1)} MB)`, true);
                
                addBootMessage(`[CACHE] Found ${key}: ${key === "hdd" ? (cached.size / 1024 / 1024).toFixed(1) + " MB" : sizeKB + " KB"}`);
            } else {
                if (key === "wasm") setFileStatus(statusWasm, "downloading...", false);
                if (key === "bios") setFileStatus(statusBios, "downloading...", false);
                if (key === "vga") setFileStatus(statusVga, "downloading...", false);
                if (key === "hdd") setFileStatus(statusHdd, "downloading...", false);
            }
        } catch (e) {
            console.error(`Cache check failed for ${key}:`, e);
        }
    }
    
    // Update cache status message
    if (cachedCount === 4) {
        const totalMB = (totalCachedSize / 1024 / 1024).toFixed(1);
        cacheStatus.textContent = `✓ All assets cached (${totalMB} MB) - Instant load!`;
        cacheStatus.classList.add("cached");
        progressBar.classList.add("cached");
        addBootMessage("[CACHE] All assets found in cache");
        cacheActions.style.display = "block";
    } else if (cachedCount > 0) {
        const totalMB = (totalCachedSize / 1024 / 1024).toFixed(1);
        cacheStatus.textContent = `⚠ Partial cache (${cachedCount}/4 files, ${totalMB} MB)`;
        cacheStatus.classList.add("partial");
        addBootMessage(`[CACHE] Partial cache: ${cachedCount}/4 files`);
        cacheActions.style.display = "block";
    } else {
        cacheStatus.textContent = "First visit - Downloading all assets (~9 MB)";
        addBootMessage("[CACHE] No cached assets found");
    }
    
    // Fetch and cache function
    async function fetchAndCache(url, key) {
        try {
            const response = await fetch(url);
            const arrayBuffer = await response.arrayBuffer();
            await CacheManager.set(url, arrayBuffer, { 
                filename: key,
                version: "0.3"
            });
            cachedAssets[key] = { data: arrayBuffer, size: arrayBuffer.byteLength };
            
            const sizeKB = (arrayBuffer.byteLength / 1024).toFixed(0);
            addBootMessage(`[CACHE] Saved ${key}: ${key === "hdd" ? (arrayBuffer.byteLength / 1024 / 1024).toFixed(1) + " MB" : sizeKB + " KB"}`);
            
            // Update status
            if (key === "wasm") setFileStatus(statusWasm, `✓ cached (${sizeKB} KB)`, true);
            if (key === "bios") setFileStatus(statusBios, `✓ cached (${sizeKB} KB)`, true);
            if (key === "vga") setFileStatus(statusVga, `✓ cached (${sizeKB} KB)`, true);
            if (key === "hdd") setFileStatus(statusHdd, `✓ cached (${(arrayBuffer.byteLength / 1024 / 1024).toFixed(1)} MB)`, true);
            
            return arrayBuffer;
        } catch (e) {
            console.error(`Failed to cache ${key}:`, e);
            throw e;
        }
    }
    
    // Pre-load all assets explicitly to ensure proper caching
    async function loadAndCacheAllAssets() {
        // Load seabios.bin
        if (!cachedAssets.bios && !forceRefresh) {
            loadingFile.textContent = "Fetching seabios.bin...";
            try {
                const biosData = await fetchAndCache(ASSETS.bios, "bios");
                cachedAssets.bios = { data: biosData, size: biosData.byteLength };
                updateProgress(10, "seabios.bin (cached)", biosData.byteLength, biosData.byteLength);
            } catch (e) {
                console.error("Failed to cache seabios.bin:", e);
            }
        }
        
        // Load vgabios.bin
        if (!cachedAssets.vga && !forceRefresh) {
            loadingFile.textContent = "Fetching vgabios.bin...";
            try {
                const vgaData = await fetchAndCache(ASSETS.vga, "vga");
                cachedAssets.vga = { data: vgaData, size: vgaData.byteLength };
                updateProgress(15, "vgabios.bin (cached)", vgaData.byteLength, vgaData.byteLength);
            } catch (e) {
                console.error("Failed to cache vgabios.bin:", e);
            }
        }
        
        // Load harddisk.img (the big one - 9MB)
        if (!cachedAssets.hdd && !forceRefresh) {
            loadingFile.textContent = "Fetching harddisk.img (this may take a while)...";
            try {
                const hddData = await fetchAndCache(ASSETS.hdd, "hdd");
                cachedAssets.hdd = { data: hddData, size: hddData.byteLength };
                const sizeMB = (hddData.byteLength / 1024 / 1024).toFixed(1);
                updateProgress(50, `harddisk.img (cached - ${sizeMB} MB)`, hddData.byteLength, hddData.byteLength);
                addBootMessage(`[CACHE] harddisk.img cached: ${sizeMB} MB`);
            } catch (e) {
                console.error("Failed to cache harddisk.img:", e);
            }
        }
    }
    
    // Load all assets first
    await loadAndCacheAllAssets();
    
    // Configure V86
    const v86Config = {
        memory_size: 32 * 1024 * 1024,
        vga_memory_size: 2 * 1024 * 1024,
        screen_container: document.getElementById("screen_container"),
        autostart: true,
    };
    
    // WASM: Use cache or fetch
    if (cachedAssets.wasm && !forceRefresh) {
        v86Config.wasm_path = ASSETS.wasm;
        updateProgress(5, "v86.wasm (from cache)", cachedAssets.wasm.size, cachedAssets.wasm.size);
    } else {
        v86Config.wasm_path = ASSETS.wasm;
        v86Config.wasm_progress = function(e) {
            const percent = (e.loaded / e.total) * 10;
            updateProgress(percent, "v86.wasm", e.loaded, e.total);
        };
        // Cache after load
        fetchAndCache(ASSETS.wasm, "wasm");
    }
    
    // BIOS: Use cached buffer
    if (cachedAssets.bios) {
        v86Config.bios = { buffer: cachedAssets.bios.data };
        updateProgress(10, "seabios.bin (from cache)", cachedAssets.bios.size, cachedAssets.bios.size);
    } else {
        v86Config.bios = { url: ASSETS.bios };
        addBootMessage("[WARN] Loading seabios.bin from network");
    }
    
    // VGA BIOS: Use cached buffer
    if (cachedAssets.vga) {
        v86Config.vga_bios = { buffer: cachedAssets.vga.data };
        updateProgress(15, "vgabios.bin (from cache)", cachedAssets.vga.size, cachedAssets.vga.size);
    } else {
        v86Config.vga_bios = { url: ASSETS.vga };
        addBootMessage("[WARN] Loading vgabios.bin from network");
    }
    
    // HDD: Use cached buffer
    if (cachedAssets.hdd) {
        v86Config.hda = { buffer: cachedAssets.hdd.data };
        updateProgress(50, "harddisk.img (from cache)", cachedAssets.hdd.size, cachedAssets.hdd.size);
        addBootMessage("[CACHE] Using cached harddisk.img");
    } else {
        v86Config.hda = { url: ASSETS.hdd, async: true };
        addBootMessage("[WARN] Loading harddisk.img from network");
    }
    
    // Initialize emulator
    window.emulator = new V86(v86Config);

    // Monitor loading state
    const checkLoading = setInterval(function() {
        if (window.emulator.is_running()) {
            clearInterval(checkLoading);
            updateProgress(100, "Complete!");
            addBootMessage("[BOOT] Starting IYKEOS...");
            
            setTimeout(function() {
                loadingOverlay.style.opacity = "0";
                loadingOverlay.style.transition = "opacity 0.5s";
                setTimeout(function() {
                    loadingOverlay.style.display = "none";
                    enableControls();
                }, 500);
            }, 1000);
        }
    }, 100);

    // Button event listeners
    document.getElementById("run").onclick = function() {
        if (window.emulator.is_running()) {
            window.emulator.stop();
            this.value = "Resume";
        } else {
            window.emulator.run();
            this.value = "Pause";
        }
    };

    document.getElementById("reset").onclick = function() {
        window.emulator.restart();
    };

    document.getElementById("exit").onclick = function() {
        window.emulator.stop();
        window.emulator.destroy();
        location.reload();
    };

    document.getElementById("save_state").onclick = async function() {
        const state = await window.emulator.save_state();
        const blob = new Blob([state], { type: "application/octet-stream" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = "v86-state.bin";
        a.click();
        URL.revokeObjectURL(url);
    };

    document.getElementById("load_state").onclick = function() {
        document.getElementById("load_state_input").click();
    };

    document.getElementById("load_state_input").onchange = async function(e) {
        const file = e.target.files[0];
        if (file) {
            const arrayBuffer = await file.arrayBuffer();
            await window.emulator.restore_state(arrayBuffer);
        }
    };

    let mouseEnabled = true;
    document.getElementById("toggle_mouse").onclick = function() {
        mouseEnabled = !mouseEnabled;
        window.emulator.mouse_set_enabled(mouseEnabled);
        this.value = mouseEnabled ? "Disable mouse" : "Enable mouse";
    };

    document.getElementById("lock_mouse").onclick = function() {
        window.emulator.lock_mouse();
    };

    document.getElementById("fullscreen").onclick = function() {
        window.emulator.screen_go_fullscreen();
    };

    document.getElementById("take_screenshot").onclick = function() {
        const img = window.emulator.screen_make_screenshot();
        const url = img.src;
        const a = document.createElement("a");
        a.href = url;
        a.download = "screenshot.png";
        a.click();
    };

    let theatreMode = false;
    document.getElementById("toggle_theatre").onclick = function() {
        theatreMode = !theatreMode;
        if (theatreMode) {
            document.body.style.background = "black";
            document.getElementById("runtime_options").style.display = "none";
        } else {
            document.body.style.background = "#0e0e0e";
            document.getElementById("runtime_options").style.display = "block";
        }
    };

    document.getElementById("scale").onchange = function() {
        const scale = parseFloat(this.value);
        window.emulator.screen_set_scale(scale, scale);
        setTimeout(() => {
            const canvas = document.querySelector("#screen_container canvas");
            if (canvas) {
                canvas.style.marginLeft = "0px";
                canvas.style.marginTop = "0px";
                canvas.style.left = "0px";
                canvas.style.top = "0px";
            }
        }, 0);
    };
    
    // Cache management buttons
    document.getElementById("clear_cache").onclick = async function() {
        if (confirm("Clear all cached assets? You'll need to download ~9MB again next time.")) {
            try {
                await CacheManager.clear();
                alert("Cache cleared successfully!");
                location.reload();
            } catch (e) {
                alert("Failed to clear cache: " + e.message);
            }
        }
    };
    
    document.getElementById("refresh_cache").onclick = async function() {
        if (confirm("Re-download all assets from server?")) {
            try {
                await CacheManager.clear();
                location.reload();
            } catch (e) {
                alert("Failed to refresh: " + e.message);
            }
        }
    };
};
</script>

</body>
</html>
